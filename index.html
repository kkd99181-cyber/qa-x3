<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#eceee9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c0b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="검증용">
  <meta name="format-detection" content="telephone=no">
  <title>검증용 일정</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <p style="margin:0;padding:calc(env(safe-area-inset-top) + 4px) 16px 4px;background:#f2c200;color:#121311;font:700 13px/1.4 system-ui;text-align:center">검증용 앱 · 가상 데이터 · 운영 앱과 별개</p>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-now" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-days" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M8 3.5h8l3 3V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6.5z"/><circle cx="12" cy="7.5" r="1.5"/><path d="M5 15h14"/></symbol>
    <symbol id="i-money" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.75"/><path d="M6 9.5v5M18 9.5v5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6.5l1.5 1.5L8 5.5M4 12.5l1.5 1.5L8 11.5M4 18.5l1.5 1.5L8 17.5M11 7h9M11 13h9M11 19h9"/></symbol>
    <symbol id="i-nav" viewBox="0 0 24 24"><path d="M3.5 11 20 4l-7 16.5-2.2-7.3z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M10.5 3.5c0-.8.7-1.5 1.5-1.5s1.5.7 1.5 1.5V9l7.5 4.5V16l-7.5-2.3V18l2.5 2v1.5L12 20.5l-4 1V20l2.5-2v-4.3L3 16v-2.5L10.5 9z"/></symbol>
    <symbol id="i-train" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 14.5h.01M15 14.5h.01M8 17l-2 4M16 17l2 4"/></symbol>
    <symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="14" rx="2.5"/><path d="M4 11h16M8 17.5V20M16 17.5V20M8 14.5h.01M16 14.5h.01"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16.5V12l2-5h10l2 5v4.5zM5 12h14M7.5 19.5v-3M16.5 19.5v-3M8 14.5h.01M16 14.5h.01"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.75"/><path d="M10 21l2-6 3 3v3M12 15l-1-5 3-2 2 4 3 1M11 10l-3 2-1 3"/></symbol>
    <symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6M7 12h.01"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6 3h3l1.5 5-2 1.5a12 12 0 0 0 6 6l1.5-2 5 1.5v3a2 2 0 0 1-2 2A17 17 0 0 1 4 5a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 4.5v15M16 4.5v15"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M19 5.5v13L9 12z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M5 5.5v13L15 12z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4.5v4h4"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3.5" y="14" width="4" height="6" rx="1.5"/><rect x="16.5" y="14" width="4" height="6" rx="1.5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4M9 12h6M9 16h6"/></symbol>
  </svg>

  <div class="update" id="update" role="status" hidden>
    <span class="update__text">새 일정 데이터가 있어요</span>
    <button class="btn" id="update-btn" type="button">업데이트</button>
  </div>

  <header class="appbar">
    <div class="appbar__row">
      <h1 class="appbar__title" id="appbar-title">일정</h1>
      <p class="appbar__meta" id="appbar-meta"></p>
      <a class="appbar__btn" href="#/settings" id="settings-btn" aria-label="설정"><svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg></a>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <p class="empty">불러오는 중</p>
  </main>

  <audio id="audio" preload="none" playsinline></audio>
  <section class="player" id="player" aria-label="오디오 가이드 재생" hidden></section>

  <nav class="tabbar" aria-label="주요 화면">
    <a class="tabbar__item" href="#/now" data-tab="now"><svg class="icon"><use href="#i-now"/></svg>지금</a>
    <a class="tabbar__item" href="#/days" data-tab="days"><svg class="icon"><use href="#i-days"/></svg>일정</a>
    <a class="tabbar__item" href="#/bookings" data-tab="bookings"><svg class="icon"><use href="#i-tag"/></svg>예약</a>
    <a class="tabbar__item" href="#/money" data-tab="money"><svg class="icon"><use href="#i-money"/></svg>낼 돈</a>
    <a class="tabbar__item" href="#/check" data-tab="check"><svg class="icon"><use href="#i-list"/></svg>준비</a>
  </nav>

  <script type="module" src="src/main.js"></script>
</body>
</html>
